<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mv-studio</title>
<style>
  @font-face { font-family: "Archivo"; src: url("/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Plex Mono"; src: url("/fonts/PlexMono-Medium.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Plex Mono"; src: url("/fonts/PlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050506; color: #e8e6e1; font: 12px ui-monospace, Menlo, monospace; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 52px 0; display: flex; align-items: center; justify-content: center; }
  #view { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; padding: 6px 12px; box-sizing: border-box; background: #0c0c0e; }
  #seek { width: 100%; margin: 0; accent-color: #ff6a1a; }
  #status { color: #8d8a84; white-space: nowrap; overflow: hidden; }
  #error { display: none; position: fixed; inset: 8px 8px auto 8px; max-height: 50vh; overflow: auto; background: #3a0d0d; color: #ffc4c4; padding: 8px; white-space: pre-wrap; z-index: 2; }
  body.export #bar { display: none; } body.export #stage { inset: 0; }
  body.export #view { width: 1920px; height: 1080px; max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="1920" height="1080"></canvas></div>
<div id="bar"><input id="seek" type="range" min="0" step="0.001" value="0" /><div id="status"></div></div>
<pre id="error"></pre>
<script type="module" src="/src/app/main.ts"></script>
</body>
</html>
